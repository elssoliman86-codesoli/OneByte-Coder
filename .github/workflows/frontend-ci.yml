name: Frontend build verification
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'skills/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'skills/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency audit findings
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); console.log(JSON.stringify({counts:a.metadata?.vulnerabilities,packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))},null,2))'
      - run: npm run build
