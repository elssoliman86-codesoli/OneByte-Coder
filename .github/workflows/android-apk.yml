name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/android-apk.yml'
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Set Android Keystore minimum SDK
        run: sed -i 's/minSdkVersion = 22/minSdkVersion = 23/' android/variables.gradle
      - run: npx cap sync android
      - name: Verify native secure-storage plugin registration
        run: grep -q "OneByteSecureStorage" android/app/src/main/assets/capacitor.plugins.json
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: onebyte-coder-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
